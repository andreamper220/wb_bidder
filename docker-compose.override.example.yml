services:
  app:
    environment:
      WB_API_MOCK: "0"
      WB_API_KEY: "ваш_токен_wb_api"
      APP_SECRET: "сгенерируйте_openssl_rand_hex_32"

  worker-sync:
    environment:
      WB_API_MOCK: "0"
      WB_API_KEY: "ваш_токен_wb_api"

  worker-bidding:
    environment:
      WB_API_MOCK: "0"
      WB_API_KEY: "ваш_токен_wb_api"

  worker-execution:
    environment:
      WB_API_MOCK: "0"
      WB_API_KEY: "ваш_токен_wb_api"
