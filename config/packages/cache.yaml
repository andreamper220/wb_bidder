framework:
    cache:
        pools:
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: '%env(MESSENGER_TRANSPORT_DSN)%'

when@test:
    framework:
        cache:
            pools:
                # Array adapter has no provider; explicit null clears merge from default.
                cache.rate_limiter:
                    adapter: cache.adapter.array
                    provider: null
